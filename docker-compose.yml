services:
  server:
    build:
      context: ./src/Server
      dockerfile: Dockerfile.server
    command: ["${PORT}"]
    tty: true
    stdin_open: true
    volumes:
      - ./data/:/usr/src/Server/build/data


  client:
    build:
      context: ./src/Client
      dockerfile: Dockerfile.client
    command: ["${HOST}", "${PORT}"]
    tty: true
    stdin_open: true

  tests:
    build:
      context: ./src/Server
      dockerfile: Dockerfile.tests