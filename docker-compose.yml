services:
  server:
    container_name: "approject_server"
    build:
      context: ./src/Server
      dockerfile: Dockerfile.server
    command: ["4545", "8", "1", "2"]
    tty: true
    stdin_open: true
    volumes:
      - ./data/:/usr/src/Server/build/data

  webserver:
    container_name: "approject_webserver"
    build:
      context: ./src/WebServer
      dockerfile: Dockerfile.webserver
    ports:
      - "3000:3000"

  client:
    container_name: "approject_client"
    build:
      context: ./src/Client
      dockerfile: Dockerfile.client
    command: ["approject_server", "4545"]
    tty: true
    stdin_open: true
  tests:
    build:
      context: ./src/Server
      dockerfile: Dockerfile.tests